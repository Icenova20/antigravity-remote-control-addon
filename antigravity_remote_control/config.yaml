name: "Antigravity Remote Control"
slug: "antigravity_remote_control"
description: "Headless Google Antigravity Remote Control daemon for Home Assistant"
version: "1.0.1"
arch:
  - amd64
  - aarch64
startup: "services"
boot: "auto"
init: false
hassio_api: true
hassio_role: "manager"
homeassistant_api: true
host_network: true
map:
  - homeassistant_config:rw
  - share:rw
  - ssl:ro
options:
  instance_name: "homeassistant"
  auto_update: true
schema:
  instance_name: "str"
  auto_update: "bool"
